name: Verify direct extensions rework

on:
  push:
    branches:
      - refactor/direct-tachiyomi
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@d2bb5a81bf6132351ee9adcc0bba8261a8d34d48 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.1.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Format, compile, test and build debug APK
        run: |
          chmod a+x gradlew
          ./gradlew clean spotlessApply compileDebugKotlin testDebugUnitTest assembleDebug --no-daemon --max-workers=1 --no-configuration-cache --rerun-tasks --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: direct-extensions-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
